# The victim application on Kubernetes.
#
# One image, three Deployments differing only by environment, mirroring the
# Compose setup. The dependency chain is expressed through DOWNSTREAM_URL
# pointing at each Service's cluster DNS name.
#
# Honest note: these manifests are written and validated with `kubectl
# --dry-run`, but the project has not been run on a live cluster. They
# describe the intended topology; they are not a deployment record.

apiVersion: v1
kind: Namespace
metadata:
  name: pagedout

---
# ── ledger-service — leaf of the chain, no downstream ────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: pagedout
  labels: { app: ledger-service, tier: victim }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ledger-service }
  template:
    metadata:
      labels: { app: ledger-service, tier: victim }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: pagedout/victim:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
          env:
            - { name: SERVICE_NAME, value: ledger-service }
            - { name: DOWNSTREAM_URL, value: "" }
            - { name: POOL_SIZE, value: "20" }
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 500m }
          # Readiness gates traffic; liveness restarts a wedged pod. Using
          # the same endpoint for both is a common mistake: a pod under a
          # memory_leak fault would be killed rather than merely drained.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: pagedout
  labels: { app: ledger-service }
spec:
  selector: { app: ledger-service }
  ports:
    - { name: http, port: 8000, targetPort: http }

---
# ── payment-service — depends on ledger ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: pagedout
  labels: { app: payment-service, tier: victim }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service, tier: victim }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: app
          image: pagedout/victim:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
          env:
            - { name: SERVICE_NAME, value: payment-service }
            - { name: DOWNSTREAM_URL, value: "http://ledger-service:8000" }
            - { name: POOL_SIZE, value: "20" }
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 500m }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: pagedout
spec:
  selector: { app: payment-service }
  ports:
    - { name: http, port: 8000, targetPort: http }

---
# ── checkout-service — entry point ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: pagedout
  labels: { app: checkout-service, tier: victim }
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout-service }
  template:
    metadata:
      labels: { app: checkout-service, tier: victim }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: app
          image: pagedout/victim:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
          env:
            - { name: SERVICE_NAME, value: checkout-service }
            - { name: DOWNSTREAM_URL, value: "http://payment-service:8000" }
            - { name: POOL_SIZE, value: "20" }
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 500m }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: pagedout
spec:
  selector: { app: checkout-service }
  ports:
    - { name: http, port: 8000, targetPort: http }

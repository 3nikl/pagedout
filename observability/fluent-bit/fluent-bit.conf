# Ships victim-app container logs into Kafka.
#
# The victim services use Docker's fluentd logging driver, which forwards each
# stdout line here. Those lines are already JSON conforming to the
# incident-signal schema, so this config only has to unwrap and forward —
# no regex parsing, no field mapping.

[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Docker's fluentd driver speaks the Forward protocol.
[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   8M

# The driver wraps the application's line in a "log" field. Parse that back
# into real fields so Kafka receives the object the app emitted, not an
# object containing a JSON string.
[FILTER]
    Name          parser
    Match         pagedout.*
    Key_Name      log
    Parser        victim_json
    Reserve_Data  Off

# Drop anything that failed to parse as JSON (uvicorn's own startup banner,
# stack traces). Without this, malformed records reach Flink, where
# json.ignore-parse-errors would silently NULL their timestamps and poison
# the window operator — a failure mode this project has already hit once.
[FILTER]
    Name          grep
    Match         pagedout.*
    Regex         event_id .+

[OUTPUT]
    Name          kafka
    Match         pagedout.*
    Brokers       kafka:9092
    Topics        logs.raw
    Timestamp_Key _fb_ts
    Retry_Limit   3
    rdkafka.log.connection.close false
    rdkafka.linger.ms 5
    rdkafka.compression.type lz4

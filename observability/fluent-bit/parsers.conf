# The victim app emits one JSON object per line, already shaped like the
# incident-signal schema. Time_Keep preserves the app's own timestamp field
# rather than letting Fluent Bit replace it with ingest time — the Flink job
# windows on event time, so the original value has to survive.

[PARSER]
    Name        victim_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On

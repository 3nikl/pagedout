apiVersion: 1

providers:
  - name: pagedout
    orgId: 1
    folder: PagedOut
    type: file
    disableDeletion: false
    # Picks up edits to the JSON without a Grafana restart, which matters
    # when iterating on panels.
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
